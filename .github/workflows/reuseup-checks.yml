name: ReuseUp browser checks
on:
  push:
    branches: [feature/reuseup-ranking-visual-2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test actual frontend with mocked Supabase
        run: python tests/browser_checks.py
      - name: Retain screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reuseup-browser-results
          path: test-results/
          retention-days: 7
