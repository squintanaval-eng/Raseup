name: ReuseUp chat and palette checks
on:
  push:
    branches: [feature/reuseup-ranking-visual-2]
    paths: ['api/chat.js','chat.js','vivid.css','visual.js','tests/chat*','.github/workflows/chat-checks.yml','vercel.json']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test API with mocked Google
        run: node --test tests/chat-api.test.cjs
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test actual frontend with mocked Auth and Gemini
        run: python tests/chat-browser.py
      - name: Save screenshots and test results (no credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reuseup-chat-results
          path: test-results/chat/
          retention-days: 7
